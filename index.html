<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/platter.svg" />
    <title>Platter</title>
    <style>
      /* Paint the window color before CSS/JS load (matches tauri.conf backgroundColor). */
      html, body { background: #0E0D0C; }
    </style>
    <script>
      // The last look's background, before anything else loads, so a light
      // look never paints dark first.
      try {
        var c = JSON.parse(localStorage.getItem("platter.theme") || "null");
        var bg = c && c.tokens && c.tokens["color-bg-base"];
        if (typeof bg === "string" && /^#[0-9a-fA-F]{3,8}$/.test(bg)) {
          var s = document.createElement("style");
          s.id = "first-paint-bg";
          s.textContent = "html, body { background: " + bg + "; }";
          document.head.appendChild(s);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
