name: release

# Pushing a vX.Y.Z tag runs lint and tests first, then builds Windows (NSIS) and
# macOS (universal), then creates a draft GitHub release with the installers,
# the updater manifest (latest.json) and the Stream Deck plugin. The plugin is
# also bundled into both apps (tauri.streamdeck.conf.json), so Settings can
# install it with one click.
#
# If the RELEASES_OWNER and RELEASES_REPO variables are set (e.g.
# "platter-releases"), the installers and latest.json go to that separate public
# repo instead, so the in-app updater can read them without credentials while
# the source repo is private. That needs a fine-grained token with Contents
# read/write on that repo, stored in the RELEASES_TOKEN secret. Without
# RELEASES_REPO the release goes to this repo.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libssl-dev
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - run: npm test
      - name: Stream Deck plugin
        working-directory: streamdeck
        run: npm ci && npm run typecheck && npm test
      - working-directory: src-tauri
        env:
          WHISPER_DONT_GENERATE_BINDINGS: 1
        run: cargo clippy --all-targets --features transcribe -- -D warnings && cargo test --features transcribe

  build:
    needs: gate
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--features transcribe'
          - platform: macos-latest
            args: '--target universal-apple-darwin --features transcribe'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            streamdeck/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      # The Stream Deck plugin (Node 20 or newer), packed to
      # streamdeck/dist/app.platter.streamdeck.streamDeckPlugin for the app to bundle.
      - name: Stream Deck plugin
        working-directory: streamdeck
        run: npm ci && npm run pack
      # Transcription builds whisper.cpp with the runner's CMake. On Windows
      # its bindings are generated with the runner's LLVM (the shipped ones
      # are for 64-bit long, which Windows doesn't have); macOS can use the
      # shipped ones.
      - if: matrix.platform == 'macos-latest'
        run: |
          echo "WHISPER_DONT_GENERATE_BINDINGS=1" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=10.15" >> "$GITHUB_ENV"
      # Mac signing and notarization switch on only when every Apple secret is
      # set; without them the Mac build stays unsigned, as before. Tauri signs
      # with the hardened runtime, notarizes and staples when these are present.
      - if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MAC_SIGNING: ${{ vars.MAC_SIGNING }}
        run: |
          if [ "$MAC_SIGNING" = "off" ]; then
            echo "Mac signing and notarization: off (MAC_SIGNING variable), building unsigned"
          elif [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]              && [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            {
              # Base64 may wrap over several lines; the delimiter form keeps it whole.
              echo "APPLE_CERTIFICATE<<APPLE_CERT_EOF"
              echo "$APPLE_CERTIFICATE"
              echo "APPLE_CERT_EOF"
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
            echo "Mac signing and notarization: on"
          else
            true
          fi
          if [ "$MAC_SIGNING" != "off" ] && [ -z "$APPLE_CERTIFICATE" ]; then
            echo "Mac signing and notarization: off (Apple secrets not set), building unsigned"
          fi
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ vars.RELEASES_REPO && secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PLATTER_DISCORD_APP_ID: ${{ secrets.PLATTER_DISCORD_APP_ID }}
          PLATTER_ACOUSTID_KEY: ${{ secrets.PLATTER_ACOUSTID_KEY }}
        with:
          owner: ${{ vars.RELEASES_OWNER || github.repository_owner }}
          repo: ${{ vars.RELEASES_REPO || github.event.repository.name }}
          tagName: ${{ github.ref_name }}
          releaseName: 'Platter ${{ github.ref_name }}'
          releaseBody: 'The Windows installer is not code-signed yet: on SmartScreen click More info, then Run anyway. The Mac app is signed and notarized.'
          releaseDraft: true
          # Not a prerelease: the updater reads releases/latest, which skips prereleases.
          prerelease: false
          includeUpdaterJson: true
          generateReleaseNotes: true
          args: ${{ matrix.args }} --config src-tauri/tauri.streamdeck.conf.json
      # The plugin as a release asset too, for people who install it by hand.
      # Both builds try; the second finds it there already.
      - name: Upload the Stream Deck plugin
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
          OWNER: ${{ vars.RELEASES_OWNER || github.repository_owner }}
          REPO: ${{ vars.RELEASES_REPO || github.event.repository.name }}
        with:
          github-token: ${{ vars.RELEASES_REPO && secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
            const name = "app.platter.streamdeck.streamDeckPlugin";
            const { OWNER: owner, REPO: repo } = process.env;
            const release_id = Number(process.env.RELEASE_ID);
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { owner, repo, release_id });
            if (assets.some((a) => a.name === name)) {
              core.info(`${name} is already on the release`);
              return;
            }
            await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id,
              name,
              data: fs.readFileSync(`streamdeck/dist/${name}`),
              headers: { "content-type": "application/octet-stream" },
            });
