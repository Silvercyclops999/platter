name: release

# Pushing a vX.Y.Z tag runs lint and tests first, then builds Windows (NSIS) and
# macOS (universal), then creates a draft GitHub release with the installers and
# the updater manifest (latest.json).
#
# If the RELEASES_OWNER and RELEASES_REPO variables are set (e.g.
# "platter-releases"), the installers and latest.json go to that separate public
# repo instead, so the in-app updater can read them without credentials while
# the source repo is private. That needs a fine-grained token with Contents
# read/write on that repo, stored in the RELEASES_TOKEN secret. Without
# RELEASES_REPO the release goes to this repo.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libssl-dev
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - run: npm test
      - working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings && cargo test

  build:
    needs: gate
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ vars.RELEASES_REPO && secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: ${{ vars.RELEASES_OWNER || github.repository_owner }}
          repo: ${{ vars.RELEASES_REPO || github.event.repository.name }}
          tagName: ${{ github.ref_name }}
          releaseName: 'Platter ${{ github.ref_name }}'
          releaseBody: 'Early build, installers not code-signed yet. Windows: SmartScreen, More info, Run anyway. macOS: right-click, Open.'
          releaseDraft: true
          # Not a prerelease: the updater reads releases/latest, which skips prereleases.
          prerelease: false
          includeUpdaterJson: true
          generateReleaseNotes: true
          args: ${{ matrix.args }}
