name: ci

# Lint and tests on every push and PR to main, and on check/* branches (push
# one to test work here instead of on a desktop). Linux only, since those are
# the cheapest Actions minutes. Windows and macOS builds run on tags (release.yml).
on:
  push:
    branches: [main, 'check/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: these jobs only check out and test.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Vulkan headers and glslc build transcription on the graphics card.
      - name: Linux deps (webview, audio, Vulkan)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libssl-dev libvulkan-dev glslc
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # The Unraid template and compose file name this version's image.
      - run: node scripts/pin-bridge-template.mjs --check
      - run: npm test
      - run: npm run build
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      # With transcription (whisper.cpp with Vulkan, built with the runner's
      # CMake). Its bindings are generated with the runner's libclang: the
      # ones shipped with whisper-rs leave out the Vulkan functions.
      - name: cargo clippy (transcribe)
        working-directory: src-tauri
        run: cargo clippy --all-targets --features transcribe -- -D warnings
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --features transcribe
      # The app must start without a Vulkan driver: the binary may not need
      # the loader, and the probe (no graphics card here) finds no card.
      - name: no Vulkan needed to start
        working-directory: src-tauri
        run: |
          cargo build --features transcribe
          if readelf -d target/debug/platter | grep -i vulkan; then echo "the binary needs the Vulkan loader"; exit 1; fi
          PLATTER_SPEECH_GPU=1 target/debug/platter --speech-probe | tee probe.txt
          grep -qx '\[\]' probe.txt

  # Every phone page in the browser mock at 390, 430 and 440 px, in both looks:
  # no text spilling sideways or cut off, no clipped icons, no tap target under 44 px.
  phone-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The browser comes from the cache when it can. No --with-deps: the runner
      # already has Chrome's libraries, the app brings its own fonts, and the apt
      # mirror sometimes crawls at a few KB/s, which used to eat the whole timeout.
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # Each try gets 90 seconds (a good one takes about 20). If all three stall,
      # the runner's own Chrome runs the guard instead of the job timing out.
      - name: Chromium for the guard
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 6
        run: |
          for try in 1 2 3; do
            if timeout -k 10 90 npx playwright-core install --only-shell chromium; then exit 0; fi
            echo "Chromium download try $try failed or stalled"
            rm -rf ~/.cache/ms-playwright
            sleep 5
          done
          echo "::warning::Chromium download failed three times, using the runner's Chrome"
          echo "CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - run: node scripts/phone-layout-guard.mjs

  # The UI tests again in a time zone where it's already tomorrow (UTC+14), so a
  # test that only passes on one side of midnight fails here instead of in a
  # release.
  ui-tomorrow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Pacific/Kiritimati
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  # The Stream Deck plugin: types, tests, and that it builds and packs.
  streamdeck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: streamdeck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: streamdeck/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run pack

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --no-banner -c .gitleaks.toml .

  # Known vulnerabilities in the Rust and npm packages Platter ships with.
  # Fails on advisories (not on "unmaintained" warnings).
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Reviewed and ignored: RUSTSEC-2026-0367/0368/0369 are about symlinks and Unix
      # permissions when zip 4 extracts archives. Only tauri-plugin-updater still uses
      # zip 4 (on Windows, even in its newest release), and it only extracts update
      # packages whose signature it has checked against Platter's own key. Drop these
      # ignores once the updater moves to zip 9 or later.
      # RUSTSEC-2026-0381 also names webpki-roots 0.26.11, which tokio-tungstenite
      # pulls in. That version only re-exports webpki-roots 1, which is on the fixed
      # 1.0.10, so the roots it gives are the fixed ones. Drop it once
      # tokio-tungstenite depends on webpki-roots 1 directly.
      - name: cargo audit
        run: cargo audit --file src-tauri/Cargo.lock --ignore RUSTSEC-2026-0367 --ignore RUSTSEC-2026-0368 --ignore RUSTSEC-2026-0369 --ignore RUSTSEC-2026-0381
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high
