name: ci

# Lint and tests on every push and PR to main, and on check/* branches (push
# one to test work here instead of on a desktop). Linux only, since those are
# the cheapest Actions minutes. Windows and macOS builds run on tags (release.yml).
on:
  push:
    branches: [main, 'check/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Linux deps (webview, audio)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libssl-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      # With transcription (whisper.cpp, built with the runner's CMake). The
      # bindings shipped with whisper-rs are generated on Linux, so they fit
      # here and libclang isn't needed.
      - name: cargo clippy (transcribe)
        working-directory: src-tauri
        env:
          WHISPER_DONT_GENERATE_BINDINGS: 1
        run: cargo clippy --all-targets --features transcribe -- -D warnings
      - name: cargo test
        working-directory: src-tauri
        env:
          WHISPER_DONT_GENERATE_BINDINGS: 1
        run: cargo test --features transcribe

  # The Stream Deck plugin: types, tests, and that it builds and packs.
  streamdeck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: streamdeck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: streamdeck/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run pack

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --no-banner -c .gitleaks.toml .
