name: mac-check

# Compiles the Rust core on macOS when platform code changes, so Mac-only code
# breaks before a release instead of during one.
on:
  push:
    branches: [main]
    paths:
      - "src-tauri/src/platform/**"
      - "src-tauri/src/audio/exclusive/**"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "src-tauri/.cargo/**"
      - "src-tauri/src/lyrics/transcribe/**"
  workflow_dispatch:

concurrency:
  group: mac-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build
      - name: cargo clippy
        working-directory: src-tauri
        env:
          WHISPER_DONT_GENERATE_BINDINGS: 1
          MACOSX_DEPLOYMENT_TARGET: "10.15"
        run: cargo clippy --all-targets --features transcribe -- -D warnings
      # The universal app's Intel half builds whisper.cpp for x86_64 on this
      # ARM runner; check that cross build too.
      - name: cargo check (Intel, transcribe)
        working-directory: src-tauri
        env:
          WHISPER_DONT_GENERATE_BINDINGS: 1
          MACOSX_DEPLOYMENT_TARGET: "10.15"
        run: |
          rustup target add x86_64-apple-darwin
          cargo check --target x86_64-apple-darwin --features transcribe
      # A full link of the app with transcription, so missing symbols show
      # up here and not in the release.
      - name: cargo build (link, transcribe)
        working-directory: src-tauri
        env:
          WHISPER_DONT_GENERATE_BINDINGS: 1
          MACOSX_DEPLOYMENT_TARGET: "10.15"
        run: cargo build --features transcribe
