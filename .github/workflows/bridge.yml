name: bridge

# The Platter Bridge image (docker/bridge). On a version tag it's built for
# amd64 and arm64 on GitHub's own runners (each natively, no emulation) and
# pushed to GitHub Container Registry as platter-bridge:<version> and
# :latest. On check/bridge it's built and started once, without pushing.
on:
  push:
    tags: ['v*']
    branches: ['check/bridge']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/platter-bridge" >> "$GITHUB_ENV"
          echo "ARCH=${PLATFORM#linux/}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (check)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/bridge/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: platter-bridge:check
          cache-from: type=gha,scope=bridge-${{ env.ARCH }}
          cache-to: type=gha,mode=max,scope=bridge-${{ env.ARCH }}
      - name: Start it once
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          # Started from its own settings, with no computer and no code.
          docker run -d --name bridge -e LIDARR_URL=http://10.20.30.40:8686 -e LIDARR_API_KEY=checkonly0000 platter-bridge:check
          for i in $(seq 1 30); do
            docker logs bridge 2>&1 | grep -q "Not paired yet" && break
            sleep 2
          done
          docker logs bridge
          docker logs bridge 2>&1 | grep -q "Not paired yet"
          docker logs bridge 2>&1 | grep -q "Using the Bridge's own settings for: lidarrUrl, lidarrKey"
          ! docker logs bridge 2>&1 | grep -q "checkonly0000"
          # Its own pair code, in the log and on the status page.
          docker logs bridge 2>&1 | grep -q "PBB-"
          docker exec bridge platter-bridge status
          docker exec bridge platter-bridge status | grep -q "Pair code"
          docker exec bridge platter-bridge health
          test "$(docker exec bridge id -u)" != "0"
          test -z "$(docker port bridge)"
          docker stop bridge
          docker image ls platter-bridge:check
      - name: Build and push
        if: startsWith(github.ref, 'refs/tags/v')
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/bridge/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=bridge-${{ env.ARCH }}
          cache-to: type=gha,mode=max,scope=bridge-${{ env.ARCH }}
      - name: Keep the digest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: digest-${{ env.ARCH }}
          path: digests/*
          retention-days: 1

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The Unraid template must follow main and :latest
      # (scripts/pin-bridge-template.mjs), so Unraid offers each new release.
      - name: Template pinned to this release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          grep -q "platter-bridge:latest<" docker/bridge/platter-bridge.xml
          grep -q "/platter/main/docker/bridge/platter-bridge.xml" docker/bridge/platter-bridge.xml
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: One tag for both
        working-directory: digests
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/platter-bridge"
          VERSION="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create -t "$IMAGE:$VERSION" -t "$IMAGE:latest" $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$VERSION"
