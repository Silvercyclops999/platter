name: help-site

# Builds the public help pages from docs/help (the same Markdown the app
# bundles) and publishes them with GitHub Pages. Fails on a broken link.
on:
  push:
    branches: [main]
    paths: ['docs/help/**', 'src/help/**', 'scripts/build-help-site.ts', '.github/workflows/help-site.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: help-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --experimental-strip-types scripts/build-help-site.ts site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
