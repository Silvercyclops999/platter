<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Platter's icon master, full bleed: the OS rounds the corners (iOS,
       Icon Composer). The mark is a P whose bowl is a record: a ring with the
       spindle in its centre. Drawn on a 1024 grid: bowl r 208 with a 88 counter
       (weight 120), stem 116 wide (a touch lighter, so it reads the same),
       mark 416 x 632 centred. app-icon-desktop.svg is the same drawing on the
       macOS icon grid, which the desktop icons come from. -->
  <rect width="1024" height="1024" fill="#1A1816"/>
  <path fill="#CDAE6E" fill-rule="evenodd" d="M304 828V404A208 208 0 1 1 420 590.55V828Z M600 404A88 88 0 1 0 424 404A88 88 0 1 0 600 404Z"/>
  <circle cx="512" cy="404" r="30" fill="#F2EDE4"/>
</svg>
