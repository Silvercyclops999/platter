<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Desktop icon (npm run tauri icon src-tauri/app-icon-desktop.svg): the
       app-icon.svg drawing on the macOS grid, an 824 tile with 100 of clear
       space, so macOS shows it as is and Windows gets the same rounded tile.
       The mark keeps its weight-based offset inside the tile. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#1A1816"/>
  <g transform="translate(512 512) scale(0.8047) translate(-512 -512)">
    <path fill="#CDAE6E" fill-rule="evenodd" d="M296 876V456A240 240 0 1 1 408 659.02V876Z M616 456A80 80 0 1 0 456 456A80 80 0 1 0 616 456Z"/>
    <circle cx="536" cy="456" r="32" fill="#F2EDE4"/>
  </g>
</svg>
