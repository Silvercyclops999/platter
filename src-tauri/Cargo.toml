[package]
name = "platter"
version = "0.2.9"
description = "Platter — a desktop music player for your Plex library"
authors = ["Adam"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "platter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# On-device lyrics transcription with whisper.cpp. Off in plain builds so they
# don't need CMake; CI and release builds turn it on.
transcribe = ["dep:whisper-rs"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.3", features = ["full"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream", "http2", "query", "gzip"] }
thiserror = "2.0.21"
tracing = "0.1.44"
parking_lot = "0.12.5"
futures = "0.3.34"
url = "2.5.8"
rand = "0.10.3"
bytes = "1.12.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
keyring = { version = "3", features = ["windows-native", "apple-native"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
symphonia = { version = "0.6.1", features = ["all"] }
cpal = "0.18.2"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
async-trait = "0.1.92"
unicode-normalization = "0.1.25"
percent-encoding = "2.3.2"
rubato = "5"
tauri-plugin-updater = "2.13.3"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
fs4 = { version = "1", features = ["sync"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
mdns-sd = { version = "0.21.5", default-features = false }
if-addrs = "0.15"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
md-5 = "0.10.6"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
sha2 = "0.10"
# On-device lyrics transcription (the `transcribe` feature). Builds whisper.cpp
# from source, so it needs CMake and a C++ compiler.
whisper-rs = { version = "0.16.0", optional = true, features = ["tracing_backend"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
souvlaki = { version = "0.8.3", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Power", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
dotenvy = "0.15.7"
hound = "3.5.1"
tempfile = "3.27.0"
wiremock = "0.6.5"
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
# Paused clock for the rate limiter tests.
tokio = { version = "1.53.3", features = ["full", "test-util"] }
