[package]
name = "platter"
version = "0.2.27"
description = "Platter — a desktop music player for your Plex library"
authors = ["Adam"]
edition = "2024"
default-run = "platter"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "platter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Platter Bridge: the home side without a window (docs/BRIDGE.md).
[[bin]]
name = "platter-bridge"
path = "src/bin/platter-bridge.rs"
# Built only for the container, so desktop bundles don't pick it up.
required-features = ["bridge"]

[[bin]]
name = "platter"
path = "src/main.rs"

[features]
# On-device lyrics transcription with whisper.cpp. Off in plain builds so they
# don't need CMake; CI and release builds turn it on.
transcribe = ["dep:whisper-rs"]
# The headless Platter Bridge binary (docker/bridge).
bridge = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.3", features = ["full"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream", "http2", "query", "form", "gzip"] }
thiserror = "2.0.21"
tracing = "0.1.44"
parking_lot = "0.12.5"
futures = "0.3.34"
url = "2.5.8"
quick-xml = "0.42"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
rand = "0.10.3"
bytes = "1.12.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
keyring = { version = "3", features = ["windows-native", "apple-native"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
symphonia = { version = "0.6.1", features = ["all"] }
cpal = "0.18.2"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
async-trait = "0.1.92"
unicode-normalization = "0.1.25"
percent-encoding = "2.3.2"
rubato = "5"
tauri-plugin-updater = "2.13.3"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
fs4 = { version = "1", features = ["sync"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
mdns-sd = { version = "0.21.5", default-features = false }
if-addrs = "0.15"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
md-5 = "0.10.6"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
sha2 = "0.10"
# Copying keys between devices: a password-authenticated key exchange over
# the 6-digit code, then the keys sealed with an AEAD, and the code as a QR.
spake2 = "0.4.0"
chacha20poly1305 = "0.11.0"
# Listen along: sealed messages through the relay are base64 text.
base64 = "0.22.1"
qrcode = { version = "0.14.1", default-features = false }
# Platter Bridge: sealed messages are compressed before they are split.
flate2 = "1.1.10"
# On-device lyrics transcription (the `transcribe` feature). Builds whisper.cpp
# from source, so it needs CMake and a C++ compiler. The raw API is for asking
# which GPU it will use.
whisper-rs = { version = "0.16.0", optional = true, features = ["tracing_backend", "raw-api"] }
tauri-plugin-clipboard-manager = "2.5.0"
# Song analysis for Automix: real FFTs (MIT or Apache-2.0; rubato uses it already).
realfft = "3.5"
# Identify by sound: a pure Rust port of Chromaprint (MIT).
rusty-chromaprint = "0.3.0"
# Library import: account data downloads come as zip files.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
kakasi = "0.1.0"
# Upgrades: carry a file's tags onto its better copy (any format to any format).
# Tag editor: writes tags in place on the music share.
lofty = "0.25.4"
pinyin = { version = "0.11.0", default-features = false, features = ["with_tone"] }
# Lyrics files in older encodings (Shift-JIS, Windows-1252 and others).
encoding_rs = "0.8.35"
chardetng = "0.1.17"
# Sync to a device: converts songs for small players. FLAC (Apache-2.0, pure
# Rust), MP3 with LAME (LGPL, built from source with the C compiler), Opus
# (libopus translated to Rust, BSD) in an Ogg file.
flacenc = { version = "0.5.1", default-features = false }
mp3lame-encoder = "0.2.5"
unsafe-libopus = "0.2.0"
ogg = "0.9.2"

# Transcription on the graphics card with Vulkan (any vendor). Building needs
# the Vulkan headers and glslc; the app needs only the GPU driver, and starts
# without one (see lyrics/transcribe/gpu.rs).
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
whisper-rs = { version = "0.16.0", optional = true, features = ["tracing_backend", "raw-api", "vulkan"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
souvlaki = { version = "0.8.3", default-features = false }

# Lower thread priority for the LRCLIB challenge and song analysis.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
# The audio features are for bit-perfect (exclusive) output; cpal already
# builds them.
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Console", "Win32_System_Power", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Media", "Win32_Media_Audio", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse", "Win32_Security", "Win32_System_LibraryLoader", "Win32_Storage_FileSystem"] }

# Bit-perfect output on macOS (hog mode, nominal rate). cpal already uses both.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["std", "AudioHardware"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFString"] }
# The thermal state (background speech work waits while the Mac runs warm).
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSProcessInfo"] }
# Transcription on the GPU with Metal (build.rs links the clang runtime it needs).
whisper-rs = { version = "0.16.0", optional = true, features = ["tracing_backend", "raw-api", "metal"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
# Line tables only: full debug info grew past what the Windows linker's
# program database can hold (LNK1140). Backtraces keep file and line.
[profile.dev]
debug = "line-tables-only"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Unwind, so a panic inside a decoder on one damaged file is caught
# (`catch_unwind` around per-file parsing) instead of ending the app.
panic = "unwind"
strip = true

# The Bridge's container image: release, with a lighter link-time pass so
# the image builds in a reasonable time on CI.
[profile.bridge]
inherits = "release"
lto = "thin"
codegen-units = 16

[dev-dependencies]
dotenvy = "0.15.7"
hound = "3.5.1"
tempfile = "3.27.0"
wiremock = "0.6.5"
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
# Paused clock for the rate limiter tests.
tokio = { version = "1.53.3", features = ["full", "test-util"] }
