<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Tray glyph (Windows): the app icon at 32 px, a graphite tile with the
       brass P, no spindle (a one-pixel dot in a three-pixel hole would only
       fill it in). The mark is centred by its outline here: at this size the
       icon's weight offset would push it into the tile's edge. Reads on
       light and dark taskbars. tray-template.svg is the macOS menu bar copy. -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="#1A1816"/>
  <g transform="translate(16 16.4) scale(0.034) translate(-536 -546)">
    <path fill="#CDAE6E" fill-rule="evenodd" d="M296 876V456A240 240 0 1 1 408 659.02V876Z M616 456A80 80 0 1 0 456 456A80 80 0 1 0 616 456Z"/>
  </g>
</svg>
